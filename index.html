<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turquation — TYT & 11. Sınıf Fonksiyon Arenası</title>
    <meta
      name="description"
      content="Turquation: Real-time competitive multiplayer math arena for TYT & 11th Grade functions — Classic Graph Wars, Quiz Race, and Function Battleship."
    />
    <meta property="og:title" content="Turquation" />
    <meta
      property="og:description"
      content="Turquation: Real-time competitive multiplayer math arena for TYT & 11th Grade functions — Classic Graph Wars, Quiz Race, and Function Battleship."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&family=Rubik:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#A5E3FF] text-slate-900 dark:bg-[#0B162C] dark:text-slate-100 antialiased selection:bg-amber-300 selection:text-slate-950">
    <div id="root"></div>
    <script>
      (function () {
        var shown = false;
        function showFallback(reason) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0 || shown) return;
          // Auto-retry once on stale Vite module/chunk cache mismatch
          try {
            var retryKey = 'turquation_boot_retry';
            if (!sessionStorage.getItem(retryKey)) {
              sessionStorage.setItem(retryKey, '1');
              window.location.reload();
              return;
            }
          } catch (_) {}
          shown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#A5E3FF;color:#0F172A;">' +
            '<div style="max-width:440px;width:100%;background:#fff;border:3px solid #0F172A;border-radius:20px;box-shadow:0 6px 0 #0F172A;padding:24px;text-align:center;">' +
            '<h1 style="margin:0 0 8px;font-size:22px;font-weight:900;">TURQUATION</h1>' +
            '<p style="margin:0 0 16px;font-size:14px;color:#334155;">Sayfa yüklenirken bir bağlantı veya önbellek hatası oluştu.</p>' +
            (reason ? '<p style="margin:0 0 16px;font-size:12px;font-family:monospace;color:#b91c1c;word-break:break-word;">' + String(reason).replace(/[<>&]/g, '') + '</p>' : '') +
            '<button onclick="try{sessionStorage.removeItem(\'turquation_boot_retry\')}catch(_){};window.location.reload()" style="padding:10px 22px;border-radius:14px;border:2.5px solid #0F172A;background:#4ADE80;color:#052E16;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #0F172A;">Yeniden Yükle</button>' +
            '</div></div>';
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            showFallback('Modül yüklenemedi: ' + (e.target.src || e.target.href || ''));
          } else if (e && e.message) {
            showFallback(e.message);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (msg && /Failed to fetch|Loading chunk|Outdated Optimize Dep|Importing a module/i.test(msg)) {
            showFallback(msg);
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
